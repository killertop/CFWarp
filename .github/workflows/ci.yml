name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck ripgrep python3 wireguard-tools iproute2 iptables util-linux curl
      - name: Syntax, source scan and behavior regressions
        run: make test
      - name: ShellCheck
        run: shellcheck --severity=warning *.sh cfwarp-exec cmd/cfwarp lib/cfwarp-common.sh tests/*.sh
      - name: Isolated Linux network and systemd regression
        run: sudo sh tests/network-regression.sh --live
      - name: Custom installation and cleanup regression
        run: sudo sh tests/install-regression.sh --live
      - name: Check diff whitespace
        run: git diff --check
